name: Build deployment bundle

# Deployment artifact only; production activation happens on the hosting server.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          find api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        run: |
          node --check assets/page-speed.js
          node --check assets/seo-audit.js
          node --check assets/security-headers.js
          node --check assets/robots-tester.js
          node --check assets/canonical-checker.js
          node --check assets/dnssec-checker.js
          node --check assets/reverse-dns-checker.js
          node --check assets/cache-control-checker.js
          node --check assets/favicon-generator.js
          node --check assets/data-converters.js
          node --check assets/csv-to-xml.js
          node --check assets/html-to-json.js
          node --check assets/json-to-html.js
          node --check assets/uuid-validator.js
          node --check assets/uuid.js
          node --check assets/xml-escape.js
          node --check assets/regex-escaper.js
          node --check assets/ulid-generator.js
          node --check assets/random-port-generator.js
          node --check assets/mac-address-generator.js
          node --check tests/browser-smoke.cjs
          node --check assets/data-view-tools.js
          node --check assets/data-advanced-tools.js
          node --check assets/toml-tools.mjs
          node --check assets/curl-converter.js
          node --check assets/json-escape.js
          node --check assets/csv-to-json.js
          node --check assets/sql-formatter.mjs
          node --check assets/markdown-html-tools.mjs
          node --check assets/html-minifier.js
          node --check assets/jsonpath-tester.mjs
          node --check assets/css-minifier.js
          node --check deploy/lighthouse/worker.mjs
          node --check deploy/lighthouse/proxy.mjs

      - name: Validate production deploy script
        run: |
          bash -n deploy/deploy-site.sh
          grep -Fq 'python3 "$RELEASE/scripts/version-shared-assets.py" "$RELEASE"' deploy/deploy-site.sh
          if grep -Fq 'caches\\n# cannot keep older' deploy/deploy-site.sh; then echo "escaped newline corrupted deploy asset versioning block" >&2; exit 1; fi

      - name: Exercise shared asset versioning
        run: |
          rm -rf /tmp/swu-asset-version-test
          mkdir -p /tmp/swu-asset-version-test
          cp -a . /tmp/swu-asset-version-test/site
          python3 /tmp/swu-asset-version-test/site/scripts/version-shared-assets.py /tmp/swu-asset-version-test/site
          grep -q '/assets/theme.js?v=' /tmp/swu-asset-version-test/site/index.html
          grep -q '/assets/styles.css?v=' /tmp/swu-asset-version-test/site/index.html
          grep -q '/assets/tool-catalog.json?v=' /tmp/swu-asset-version-test/site/assets/theme.js
          grep -q '/assets/header-nav-search.css?v=' /tmp/swu-asset-version-test/site/assets/theme.js
          python3 /tmp/swu-asset-version-test/site/scripts/seo-static-qa.py

      - name: Normalize publisher trust navigation
        run: python3 scripts/normalize-trust-nav.py

      - name: Normalize favicon references
        run: python3 scripts/normalize-favicon.py

      - name: Static SEO QA
        run: python3 scripts/seo-static-qa.py

      - name: AdSense readiness heuristic
        run: python3 scripts/adsense-readiness.py || true

      - name: Upload site bundle
        uses: actions/upload-artifact@v4
        with:
          name: smartwebutility-site
          path: |
            .
            !.git/**
            !.github/**
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
